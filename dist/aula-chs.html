  <meta name="description" content="Temario oficial y tests para la oposición de M2 Química (personal laboral MITECO) en la Confederación Hidrográfica del Segura.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
  <style>
/* Aula CHS — hoja de estilos
   Concepto: cuaderno técnico de cuenca. Columna única de lectura, cabecera fija con navegación,
   barras de progreso dibujadas como una escala limnimétrica (regla de nivel de agua). */
:root {
  --bg: #eef3f4;
  --surface: #ffffff;
  --surface-2: #e3ecee;
  --ink: #10303a;
  --muted: #557079;
  --line: #c9d8dc;
  --accent: #0b6a76;
  --accent-ink: #ffffff;
  --accent-soft: #d3eaed;
  --ochre: #b8741f;
  --ochre-soft: #f6e6cf;
  --ok: #23774a;
  --ok-soft: #dcf0e3;
  --ko: #b03434;
  --ko-soft: #f7dede;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 48, 58, .06), 0 4px 14px rgba(16, 48, 58, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b171a; --surface: #12242a; --surface-2: #19313a; --ink: #e2eef0; --muted: #8ea8af;
    --line: #27434c; --accent: #4cb6c2; --accent-ink: #062126; --accent-soft: #163c43;
    --ochre: #e2a653; --ochre-soft: #3a2c17; --ok: #5cc48a; --ok-soft: #17372a; --ko: #ef7b7b; --ko-soft: #3e1d1f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b171a; --surface: #12242a; --surface-2: #19313a; --ink: #e2eef0; --muted: #8ea8af;
  --line: #27434c; --accent: #4cb6c2; --accent-ink: #062126; --accent-soft: #163c43;
  --ochre: #e2a653; --ochre-soft: #3a2c17; --ok: #5cc48a; --ok-soft: #17372a; --ko: #ef7b7b; --ko-soft: #3e1d1f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow {
  font-family: var(--font-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}

/* ── Cabecera ── */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center;
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text strong { font-family: var(--font-display); font-size: 1.05rem; }
.brand-text span { font-size: .78rem; color: var(--muted); }
.nav {
  display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none;
  max-width: 100%;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  white-space: nowrap; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .95rem;
  padding: 7px 11px; border-radius: 7px;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (max-width: 720px) {
  .nav { margin-left: 0; width: 100%; }
}

/* ── Página ── */
main {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 28px;
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid > * { min-width: 0; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}
.panel-flat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.lead { font-size: 1.08rem; color: var(--muted); max-width: 62ch; }

/* ── Botones ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none;
  min-height: 44px; transition: background .12s, border-color .12s;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ochre { background: var(--ochre); border-color: var(--ochre); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); border-color: var(--line); }
.btn-danger { color: var(--ko); }
.btn-danger:hover { border-color: var(--ko); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: .92rem; }

/* ── Indicadores ── */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .value { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .label { font-size: .85rem; color: var(--muted); }

/* Escala limnimétrica: barra de progreso con marcas cada 10 % */
.gauge {
  position: relative; height: 12px; border-radius: 3px; background: var(--surface-2); overflow: hidden;
}
.gauge::after {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--line) calc(10% - 1px) 10%);
  pointer-events: none;
}
.gauge > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px 0 0 3px; }
.gauge.ok > span { background: var(--ok); }
.gauge.mid > span { background: var(--ochre); }
.gauge.bad > span { background: var(--ko); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
  font-size: .8rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ko { background: var(--ko-soft); color: var(--ko); }
.chip.mid { background: var(--ochre-soft); color: var(--ochre); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.wrap { white-space: normal; border-radius: 8px; max-width: 100%; align-self: flex-start; }

/* ── Temario ── */
.bloque { display: flex; flex-direction: column; gap: 10px; }
.bloque-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.tema-row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; text-decoration: none; color: var(--ink);
}
.tema-row:hover { border-color: var(--accent); }
.tema-row > div { min-width: 0; }
.tema-num { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 600; color: var(--accent); }
.tema-row h3 { font-size: 1rem; }
.tema-row .meta { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.tema-row .gauge { margin-top: 8px; height: 8px; }
@media (max-width: 520px) {
  .tema-row { grid-template-columns: 40px 1fr; }
  .tema-row .score { grid-column: 2; justify-self: start; }
}

.resumen { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.resumen li::marker { color: var(--ochre); }

/* ── Test ── */
.test-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.test-head .gauge { flex: 1 1 200px; }
.timer { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--surface-2); }
.timer.warn { background: var(--ko-soft); color: var(--ko); }
.question { font-size: 1.15rem; font-weight: 600; line-height: 1.45; }
.options { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.option {
  width: 100%; text-align: left; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px; padding: 12px 14px;
  cursor: pointer; line-height: 1.45;
}
.option:hover:not([disabled]) { border-color: var(--accent); }
.option .letter {
  font-family: var(--font-mono); font-weight: 600; width: 28px; height: 28px; border-radius: 6px;
  display: grid; place-items: center; background: var(--surface-2); color: var(--muted);
}
.option.selected { border-color: var(--accent); background: var(--accent-soft); }
.option.selected .letter { background: var(--accent); color: var(--accent-ink); }
.option.correct { border-color: var(--ok); background: var(--ok-soft); }
.option.correct .letter { background: var(--ok); color: #fff; }
.option.wrong { border-color: var(--ko); background: var(--ko-soft); }
.option.wrong .letter { background: var(--ko); color: #fff; }
.option[disabled] { cursor: default; }
.explain {
  border-left: 4px solid var(--ochre); background: var(--ochre-soft); padding: 12px 14px; border-radius: 0 8px 8px 0;
}
.explain strong { display: block; margin-bottom: 2px; }
.qnav { display: flex; flex-wrap: wrap; gap: 6px; }
.qnav button {
  width: 38px; height: 38px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--font-mono); font-size: .85rem; cursor: pointer;
}
.qnav button.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qnav button.flagged { box-shadow: inset 0 -3px 0 var(--ochre); }
.qnav button.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.qnav button.r-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.qnav button.r-ko { background: var(--ko-soft); border-color: var(--ko); color: var(--ko); }

/* ── Resultados ── */
.score-big { font-family: var(--font-mono); font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.review-item { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.review-item .ans { font-size: .95rem; }
.review-item .ans.ok { color: var(--ok); }
.review-item .ans.ko { color: var(--ko); }

/* ── Formularios ── */
label { font-weight: 600; font-size: .95rem; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 90px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; cursor: pointer; }
.check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

/* ── Tablas ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; }

.notice {
  font-size: .9rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px;
}
.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 20;
  max-width: calc(100% - 32px);
}
footer {
  max-width: 980px; margin: 0 auto; color: var(--muted); font-size: .85rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
code { font-family: var(--font-mono); font-size: .85em; overflow-wrap: anywhere; }

</style>
</head>

/* Aula CHS — aplicación de estudio y tests para la oposición de la Confederación Hidrográfica del Segura.

(function () {
  "use strict";

  const STORE_KEY = "aulachs:v2"; // v2: temario de M2 Química (los identificadores de tema cambiaron)
  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  const $main = document.getElementById("app");

  // ─────────────────────────── Persistencia ───────────────────────────
  function emptyState() { return { stats: {}, history: [], custom: [], temas: {} }; }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return emptyState();
      const s = JSON.parse(raw);
      return { stats: s.stats || {}, history: s.history || [], custom: s.custom || [], temas: s.temas || {} };
    } catch (e) { return emptyState(); }
  }
  let state = load();
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* almacenamiento no disponible */ }
  }

  // ─────────────────────────── Utilidades ───────────────────────────
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const fmt1 = (n) => n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtTime = (s) => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  const fmtDate = (ts) => new Date(ts).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
  const gaugeClass = (p) => (p >= 70 ? "ok" : p >= 50 ? "mid" : "bad");

  function toast(msg) {
    const old = document.querySelector(".toast"); if (old) old.remove();
    const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
  }

  // ─────────────────────────── Banco de preguntas ───────────────────────────
  const temaById = {};
  const PREFIJO = { C: "Común", Q: "Química", X: "Compl." };

  // Temas importados por la persona usuaria: sustituyen título (si lo traen), ideas clave (si las traen)
  // y TODAS las preguntas de ejemplo de ese tema.
  const ORIG = {};
  T.temas.forEach((t) => { ORIG[t.id] = { titulo: t.titulo, resumen: t.resumen, preguntas: t.preguntas }; });
  function applyImports() {
    T.temas.forEach((t) => {
      const o = ORIG[t.id], imp = state.temas[t.id] || (T.misTemas || {})[t.id];
      t.titulo = o.titulo; t.resumen = o.resumen; t.preguntas = o.preguntas; t.mio = false;
      if (imp && imp.preguntas && imp.preguntas.length) {
        t.mio = true;
        t.preguntas = imp.preguntas;
        if (imp.titulo) t.titulo = imp.titulo;

      }
    });
  }
  const impOf = (id) => state.temas[id] || (T.misTemas || {})[id] || null;
  const hash = (str) => { let h = 5381; for (const ch of String(str).trim().toLowerCase()) h = ((h << 5) + h + ch.codePointAt(0)) | 0; return (h >>> 0).toString(36); };
  applyImports();

  function allQuestions() {
    const out = [];
    T.temas.forEach((t) => t.preguntas.forEach((q, i) => out.push({ id: t.mio ? t.id + "-h" + hash(q[0]) : t.id + "-" + (i + 1), tema: t.id, p: q[0], o: q[1], e: q[2] || "", mia: t.mio })));

  // Primer ejercicio M2: 45 preguntas del temario común + 45 del específico, 90 min, −1/3, 20 + 20 puntos
  function startOficial() {
    const cfg = T.convocatoria.simulacro;
    const parte = (pid) => allQuestions().filter((q) => bloqueById[temaById[q.tema].bloque].parte === pid);
    startTest({
      titulo: "Simulacro oficial · primer ejercicio", mode: "examen", oficial: true,
      minutes: cfg.minutos, penalty: cfg.penalizacion, back: "simulacro",
      partes: [
        { nombre: "Parte común", questions: parte("comun"), n: cfg.comun, max: cfg.maxParte },
        { nombre: "Parte específica", questions: parte("especifico"), n: cfg.especifico, max: cfg.maxParte }
      ]
    });
  }

  function answerCurrent(idx) {
    const it = session.items[session.current];
    if (session.mode === "estudio") {
      if (it.answer !== null) return;
      it.answer = idx;
      recordAnswer(it);
    } else {
      it.answer = it.answer === idx ? null : idx;
    }
    renderTest();
  }

  function recordAnswer(it) {
    const s = state.stats[it.q.id] || { ok: 0, ko: 0, last: null, t: 0 };
    const right = it.answer === it.correct;
    if (right) s.ok++; else s.ko++;
    s.last = right; s.t = Date.now();
    state.stats[it.q.id] = s; save();
  }

  function finishTest() {
    if (!session || session.finished) return;
    clearInterval(timerId); timerId = null;
    session.finished = true;
    session.secs = Math.round((Date.now() - session.start) / 1000);
    if (session.mode === "examen") session.items.forEach((it) => { if (it.answer !== null) recordAnswer(it); });
    const r = result(session);
    state.history.unshift({ ts: Date.now(), titulo: session.titulo, mode: session.mode, n: r.n, ok: r.ok, ko: r.ko, blank: r.blank, nota: r.nota, secs: session.secs, total40: r.partes ? r.total : undefined });
    state.history = state.history.slice(0, 200);
    save();
    go("resultado");
  }

  function result(s) {
    const n = s.items.length;
    const ok = s.items.filter((it) => it.answer !== null && it.answer === it.correct).length;
    const blank = s.items.filter((it) => it.answer === null).length;
    const ko = n - ok - blank;
    const puntos = ok - ko * s.penalty;
    const nota = Math.max(0, (puntos / n) * 10);
    let partes = null, total = 0;
    if (s.partes) {
      partes = s.partes.map((p, pi) => {
        const its = s.items.filter((it) => it.parte === pi);
        const pok = its.filter((it) => it.answer !== null && it.answer === it.correct).length;
        const pblank = its.filter((it) => it.answer === null).length;
        const pko = its.length - pok - pblank;
        const pts = Math.max(0, ((pok - pko * s.penalty) / its.length) * p.max);
        total += pts;
        return { nombre: p.nombre, n: its.length, ok: pok, ko: pko, blank: pblank, pts, max: p.max };
      });
    }
    return { n, ok, ko, blank, puntos, nota, partes, total };
  }

    document.querySelectorAll(".nav a").forEach((a) => {
      const v = a.getAttribute("href").slice(1);
      a.toggleAttribute("aria-current", h === v || (v === "temario" && h.startsWith("tema-")));
      if (a.hasAttribute("aria-current")) a.setAttribute("aria-current", "page");
    });
    if (h.startsWith("tema-") && temaById[h.slice(5)]) return renderTema(h.slice(5));
    switch (h) {
      case "temario": return renderTemario();
      case "simulacro": return renderSimulacro();
      case "fallos": return renderFallos();
      case "progreso": return renderProgreso();
      case "importar": case "mis-preguntas": return renderImportar();
      case "convocatoria": return renderConvocatoria();
      case "test": return session && !session.finished ? renderTest() : go("inicio");

          <span class="muted num" style="font-size:.9rem">${answeredCount} respondidas · ${s.items.length - answeredCount} en blanco</span>
        </div>
        <div class="qnav">${s.items.map((x, i) => `${s.partes && (i === 0 || s.items[i - 1].parte !== x.parte) ? `<span class="eyebrow" style="flex-basis:100%">${esc(s.partes[x.parte].nombre)}</span>` : ""}<button data-go="${i}" class="${x.answer !== null ? "answered" : ""} ${x.flagged ? "flagged" : ""} ${i === s.current ? "current" : ""}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join("")}</div>
        ${s.confirm ? `
          <div class="panel-flat stack" style="border-color:var(--ochre)">
            <strong>${s.items.length - answeredCount ? "Tienes " + (s.items.length - answeredCount) + " preguntas en blanco." : "Has respondido todas las preguntas."} ¿Entregar el examen?</strong>
            <div class="row"><button class="btn btn-primary" id="confirm-yes">Entregar y corregir</button><button class="btn" id="confirm-no">Seguir revisando</button></div>
          </div>` : `<div><button class="btn" id="finish2">Entregar examen</button></div>`}
      </section>` : ""}
    `;

    $main.querySelectorAll(".option").forEach((b) => (b.onclick = () => answerCurrent(parseInt(b.dataset.i, 10))));
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on("next", () => { s.current++; renderTest(); window.scrollTo(0, 0); });
    on("prev", () => { s.current--; renderTest(); });
    on("skip", () => { if (isLast) finishTest(); else { s.current++; renderTest(); } });
    on("flag", () => { it.flagged = !it.flagged; renderTest(); });
    on("finish", () => { if (s.mode === "examen") { s.confirm = true; renderTest(); } else finishTest(); });
    on("finish2", () => { s.confirm = true; renderTest(); });
    on("confirm-yes", finishTest);
    on("confirm-no", () => { s.confirm = false; renderTest(); });
    $main.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { s.current = parseInt(b.dataset.go, 10); renderTest(); }));

    if (s.limitSecs && !timerId) timerId = setInterval(tick, 500);
    tick();
  }

  function tick() {
    if (!session || !session.limitSecs || session.finished) return;
    const left = session.limitSecs - (Date.now() - session.start) / 1000;
    const el = document.getElementById("timer");
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("warn", left < 60); }
    if (left <= 0) { toast("Tiempo agotado"); finishTest(); }
  }

  document.addEventListener("keydown", (ev) => {
    if (location.hash !== "#test" || !session || session.finished) return;
    if (ev.target.matches("input, textarea, select")) return;
    const k = ev.key.toUpperCase();
    const i = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
    if (i >= 0 && i < session.items[session.current].order.length) { answerCurrent(i); ev.preventDefault(); }
    else if (ev.key === "Enter" || ev.key === "ArrowRight") { const b = document.getElementById("next") || document.getElementById("finish"); if (b) { b.click(); ev.preventDefault(); } }
    else if (ev.key === "ArrowLeft") { const b = document.getElementById("prev"); if (b && !b.disabled) b.click(); }
  });

  let reviewFilter = "todas";

    const s = session;

              : `<span class="chip ${aprobado ? "ok" : "ko"}">${aprobado ? "Aprobado" : "Por debajo de 5"}</span>

        </div>
      </section>
      ${r.partes ? `
      <section class="grid">${r.partes.map((p) => `
        <div class="panel-flat stack" style="gap:8px">

      <section class="kpis">

    on("reset", () => { confirmReset = true; renderProgreso(); });
    on("reset-no", () => { confirmReset = false; renderProgreso(); });

  function chart(items) {
    const W = 600, H = 180, P = { l: 30, r: 10, t: 10, b: 22 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const x = (i) => P.l + (items.length === 1 ? iw / 2 : (i * iw) / (items.length - 1));
    const y = (v) => P.t + ih - (v / 10) * ih;
    const pts = items.map((it, i) => x(i) + "," + y(it.nota)).join(" ");
    return `<div class="table-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px;display:block" role="img" aria-label="Evolución de la nota">
      ${[0, 5, 10].map((v) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 5 ? 'stroke-dasharray="4 4"' : ""}/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("")}
      <polygon points="${P.l},${y(0)} ${pts} ${x(items.length - 1)},${y(0)}" fill="var(--accent)" opacity=".12"/>

  // ─────────────────────────── Copia de seguridad ───────────────────────────
  function backupControls() {
    return `<div class="panel-flat stack">
      <div class="row">
        <button class="btn btn-sm" id="exp">Exportar copia</button>
        <button class="btn btn-sm" id="exp-copy" hidden>Copiar al portapapeles</button>
        <button class="btn btn-sm" id="exp-dl" hidden>Descargar .json</button>
        <label class="btn btn-sm" for="imp-file" style="font-weight:600">Importar archivo .json</label>
        <input type="file" id="imp-file" accept="application/json,.json" hidden>
      </div>
      <div class="field"><label for="backup-text">Datos (pega aquí una copia para importarla)</label>
        <textarea id="backup-text" class="num" style="font-size:.8rem" placeholder='{"stats":{…},"history":[…],"custom":[…]}'></textarea></div>
      <div><button class="btn btn-sm" id="imp-text">Importar texto pegado</button></div>
    </div>`;
  }
  function bindBackup() {
    const ta = document.getElementById("backup-text");
    document.getElementById("exp").onclick = () => {
      ta.value = JSON.stringify({ app: "aulachs", version: 1, ...state });
      document.getElementById("exp-copy").hidden = false; document.getElementById("exp-dl").hidden = false;
      ta.select();
    };
    document.getElementById("exp-copy").onclick = () => {
      navigator.clipboard.writeText(ta.value).then(() => toast("Copia en el portapapeles"), () => { ta.select(); toast("Selecciona el texto y cópialo"); });
    };
    document.getElementById("exp-dl").onclick = () => {
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([ta.value], { type: "application/json" }));
        a.download = "aula-chs-copia-" + new Date().toISOString().slice(0, 10) + ".json";
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { toast("No se pudo descargar; usa Copiar"); }
    };
    const doImport = (txt) => {
      try {
        const d = JSON.parse(txt);
        if (!d || typeof d !== "object" || (!d.stats && !d.custom && !d.history && !d.temas)) throw new Error();
        const custom = (d.custom || []).filter(validCustom).map((q, i) => ({ id: q.id || "u-" + Date.now().toString(36) + i, tema: q.tema, p: q.p, o: q.o, e: q.e || "" }));
        if (d.stats || d.history || d.temas) {
          state = { stats: d.stats || {}, history: d.history || [], custom, temas: d.temas || {} };
          applyImports(); save(); toast("Copia importada");
        } else {
          const ids = new Set(state.custom.map((q) => q.id));
          custom.forEach((q) => { if (!ids.has(q.id)) state.custom.push(q); });
          save(); toast(custom.length + " preguntas añadidas");
        }
        render();
      } catch (e) { toast("El texto no es una copia válida de Aula CHS"); }
    };
    document.getElementById("imp-text").onclick = () => doImport(ta.value);
    document.getElementById("imp-file").onchange = (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f);
    };
  }
  const validCustom = (q) => q && typeof q.p === "string" && Array.isArray(q.o) && q.o.length >= 2 && q.o.every((x) => typeof x === "string") && temaById[q.tema];

  // ─────────────────────────── Importar temas ───────────────────────────
  // Acepta JSON (uno o varios bloques pegados seguidos, con o sin ```json) con temas completos:
  // { "tema": "q21", "titulo": "…", "resumen": ["…"], "preguntas": [ { "p": "…", "correcta": "…", "incorrectas": ["…"], "e": "…" } ] }
  // También admite { "temas": [ … ] }, una lista de temas y variantes habituales de nombres de campo.

  function extractJsonValues(text) {
    const clean = String(text).replace(/^\s*```[a-zA-Z]*\s*$/gm, "").trim();
    if (!clean) return [];
    try { return [JSON.parse(clean)]; } catch (e) { /* puede haber varios bloques */ }
    const out = [];
    let depth = 0, start = -1, inStr = false, escNext = false;
    for (let i = 0; i < clean.length; i++) {
      const c = clean[i];
      if (inStr) { if (escNext) escNext = false; else if (c === "\\") escNext = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') { if (depth > 0) inStr = true; continue; }
      if (c === "{" || c === "[") { if (depth === 0) start = i; depth++; }
      else if ((c === "}" || c === "]") && depth > 0) {
        depth--;
        if (depth === 0 && start >= 0) {
          const chunk = clean.slice(start, i + 1);
          try { out.push(JSON.parse(chunk)); } catch (e) { out.push({ __error: "Hay un bloque con JSON mal formado (empieza por: " + chunk.slice(0, 60) + "…)" }); }
          start = -1;
        }
      }
    }
    return out;
  }

  function normTemaId(o) {
    const raw = [o.tema, o.id, o.codigo, o.código].find((x) => x !== undefined && x !== null && x !== "");
    const extra = String(o.parte || o.bloque || "");
    const txt = (String(raw === undefined ? "" : raw) + " " + extra).trim().toLowerCase();
    let m = txt.match(/^([cqa])\s*[-_ ]?\s*0*(\d{1,2})\b/);
    if (m) return m[1] + String(m[2]).padStart(2, "0");
    m = txt.match(/(com[uú]n|qu[ií]mica|espec[ií]fic[oa]|complementari[oa])\D{0,12}0*(\d{1,2})/) || txt.replace(/^(\d{1,2})\s+(.*)$/, "$2 $1").match(/(com[uú]n|qu[ií]mica|espec[ií]fic[oa]|complementari[oa])\D{0,12}0*(\d{1,2})/);
    if (m) { const L = /^com/.test(m[1]) ? "c" : /^compl/.test(m[1]) ? "a" : "q"; return L + String(m[2]).padStart(2, "0"); }
    return null;
  }

  const firstDef = (...xs) => xs.find((x) => x !== undefined && x !== null && x !== "");
  const LETTER_PREFIX = /^\s*[A-Fa-f]\s*[\)\.\-:]\s+/;

  // Devuelve { q: [enunciado, [correcta, ...incorrectas], explicación] } o { error }
  function normQuestion(q, numBase) {
    let p, opts, correct, inc, e;
    if (Array.isArray(q)) { p = q[0]; opts = Array.isArray(q[1]) ? q[1] : null; correct = 0; e = q[2]; }
    else if (q && typeof q === "object") {
      p = firstDef(q.p, q.pregunta, q.enunciado, q.texto);
      e = firstDef(q.e, q.explicacion, q.explicación, q.justificacion, q.justificación, q.comentario, "");
      opts = firstDef(q.o, q.opciones, q.respuestas, q.alternativas);
      correct = firstDef(q.correcta, q.respuesta_correcta, q.respuestaCorrecta, q.solucion, q.solución, q.respuesta);
      inc = firstDef(q.incorrectas, q.distractores, q.erroneas, q.erróneas);
      if (opts && !Array.isArray(opts) && typeof opts === "object") {
        // Opciones como objeto {"A": "…", "B": "…"}: si la correcta es una clave, se sustituye por su texto
        const keys = Object.keys(opts);
        const ki = typeof correct === "string" ? keys.findIndex((k) => k.trim().toUpperCase() === correct.trim().replace(/[\)\.]$/, "").toUpperCase()) : -1;
        const vals = keys.map((k) => String(opts[k]));
        if (ki >= 0) correct = vals[ki];
        opts = vals;
      }
    } else return { error: "pregunta vacía o con formato desconocido" };

    if (!p || typeof p !== "string" || !p.trim()) return { error: "falta el enunciado" };
    p = p.trim(); e = e ? String(e).trim() : "";

    if (!opts) {
      if (correct === undefined || !Array.isArray(inc)) return { error: "faltan las opciones (correcta e incorrectas): «" + p.slice(0, 50) + "…»" };
      opts = [String(correct), ...inc.map(String)]; correct = 0;
    } else {
      opts = opts.map((x) => String(x).trim());
      if (opts.length && opts.every((x) => LETTER_PREFIX.test(x))) opts = opts.map((x) => x.replace(LETTER_PREFIX, ""));
      let idx = -1;
      if (typeof correct === "number") idx = correct - numBase;
      else if (typeof correct === "string") {
        const c = correct.trim();
        const lm = c.match(/^\(?([A-Fa-f])[\)\.]?$/);
        if (lm) idx = lm[1].toUpperCase().charCodeAt(0) - 65;
        else if (/^\d+$/.test(c)) idx = parseInt(c, 10) - numBase;
        else {
          const cc = c.replace(LETTER_PREFIX, "").toLowerCase();
          idx = opts.findIndex((x) => x.toLowerCase() === cc);
        }
      }
      if (idx < 0 || idx >= opts.length) return { error: "no se identifica la respuesta correcta: «" + p.slice(0, 50) + "…»" };
      opts = [opts[idx], ...opts.filter((_, i) => i !== idx)];
    }
    opts = opts.map((x) => String(x).trim()).filter(Boolean);
    if (opts.length < 2) return { error: "necesita al menos dos opciones: «" + p.slice(0, 50) + "…»" };
    if (new Set(opts.map((x) => x.toLowerCase())).size !== opts.length) return { error: "tiene opciones repetidas: «" + p.slice(0, 50) + "…»" };
    return { q: [p, opts, e] };
  }

  function parseImport(text, origen) {
    const values = extractJsonValues(text);
    const errores = [], avisos = [], temas = {};
    // Sin JSON: se intenta leer como texto de un tema con el modelo de PDF (preguntas a)–d) y solucionario)
    if (!values.length || (values.every((v) => v && v.__error) && /solucionario/i.test(text))) {
      if (/solucionario/i.test(text)) return parseTemaText(String(text).split(/\r?\n/), origen || "Texto pegado");
      return { entries: [], errores: ["No se ha encontrado ningún bloque JSON ni un tema con preguntas y solucionario."], avisos };
    }
    const temaObjs = [];
    const collect = (v) => {
      if (!v) return;
      if (v.__error) { errores.push(v.__error); return; }
      if (Array.isArray(v)) { v.forEach(collect); return; }
      if (typeof v !== "object") return;
      if (v.app === "aulachs") { errores.push("Eso es una copia de seguridad completa: impórtala en la sección «Copia de seguridad» de más abajo."); return; }
      if (Array.isArray(v.temas)) { v.temas.forEach(collect); return; }
      if (Array.isArray(v.preguntas)) { temaObjs.push(v); return; }
      errores.push("Un bloque no tiene la lista «preguntas».");
    };
    values.forEach(collect);

    temaObjs.forEach((o) => {
      const id = normTemaId(o);
      const nombre = String(firstDef(o.tema, o.id, o.titulo, "(sin código)"));
      if (!id || !temaById[id]) { errores.push("Tema «" + nombre + "»: no reconozco el código. Usa c01–c15 (común), q01–q32 (Química) o a01–a11 (complementario)."); return; }
      // Números de respuesta correcta: si alguna pregunta usa 0, se interpretan empezando en 0; si no, empezando en 1.
      // Solo cuentan las preguntas con lista de opciones (con "correcta" + "incorrectas", un número es texto de respuesta)
      const nums = o.preguntas.map((q) => (q && typeof q === "object" && !Array.isArray(q) && Array.isArray(firstDef(q.o, q.opciones, q.respuestas, q.alternativas)) ? firstDef(q.correcta, q.respuesta_correcta, q.respuestaCorrecta, q.solucion, q.respuesta) : undefined)).filter((x) => typeof x === "number" || (typeof x === "string" && /^\d+$/.test(x.trim())));
      const numBase = nums.some((x) => Number(x) === 0) ? 0 : 1;
      if (nums.length) avisos.push(temaById[id].label + ": la respuesta correcta viene como número; se ha interpretado empezando en " + numBase + " (" + (numBase ? "1 = A" : "0 = A") + "). Revisa la muestra.");
      const t = temas[id] || (temas[id] = { titulo: "", resumen: [], preguntas: [] });
      const tit = firstDef(o.titulo, o.título, o.nombre);
      if (tit) t.titulo = String(tit).trim();
      const res = firstDef(o.resumen, o.ideas_clave, o.ideasClave, o.ideas);
      if (Array.isArray(res)) t.resumen = t.resumen.concat(res.map(String).map((x) => x.trim()).filter(Boolean));
      else if (typeof res === "string" && res.trim()) t.resumen = t.resumen.concat(res.split(/\n+/).map((x) => x.replace(/^[-•*]\s*/, "").trim()).filter(Boolean));
      o.preguntas.forEach((q, i) => {
        const r = normQuestion(q, numBase);
        if (r.error) errores.push(temaById[id].label + ", pregunta " + (i + 1) + ": " + r.error);
        else t.preguntas.push(r.q);
      });
    });
    const entries = Object.keys(temas).filter((id) => temas[id].preguntas.length).map((id) => ({ id, ...temas[id], origen: origen || "JSON" }));
    return { entries, errores, avisos };
  }

  // ── Lectura de temas con el modelo de PDF: portada (número y título), «Esquema-resumen» con «Trampas
  //    frecuentes», «Preguntas tipo test» numeradas con opciones a)–d) y «Solucionario» (n.º, letra, justificación).
  function parseTemaText(rawLines, origen) {
    const errores = [], avisos = [];
    const lines = rawLines.map((l) => String(l).replace(/\s+/g, " ").trim()).filter(Boolean)
      .filter((l) => !/^\d+\s*\/\s*\d+$/.test(l))              // n.º de página «3 / 14»
      .filter((l) => !/(\.\s?){5,}\s*\d*$/.test(l));             // líneas del índice con puntos guía
    const head = lines.slice(0, 60).join(" ");
    // Número de tema: cabecera «Tema 3 · …» o número suelto en la portada
    let num = null, tm = lines.join("\n").match(/\bTema\s+(\d{1,2})\s*[·\-–:]/);
    if (tm) num = parseInt(tm[1], 10);
    const coverIdx = lines.slice(0, 15).findIndex((l) => /^\d{1,2}$/.test(l));
    if (num === null && coverIdx >= 0) num = parseInt(lines[coverIdx], 10);
    let bloque = null;
    if (/parte com[uú]n|temario com[uú]n|organizaci[oó]n y funcionamiento/i.test(head)) bloque = "c";
    else if (/qu[ií]mica/i.test(head)) bloque = "q";
    let id = num && bloque ? bloque + String(num).padStart(2, "0") : null;
    if (id && !temaById[id]) id = null;
    // Título: líneas de portada tras el número, hasta los datos de especialidad
    let titulo = "";
    if (coverIdx >= 0) {
      const stop = /^(especialidad|grupo profesional|parte com|temario com|confederaci|contenido|datos revisados|personal laboral|índice)/i;
      const tl = [];
      for (let i = coverIdx + 1; i < Math.min(lines.length, coverIdx + 8) && !stop.test(lines[i]); i++) tl.push(lines[i]);
      titulo = tl.join(" ").trim();
    }
    const lastIdx = (re, from = 0) => { let r = -1; lines.forEach((l, i) => { if (i >= from && re.test(l)) r = i; }); return r; };
    const iQ = lastIdx(/^(\d+\.\s*)?Preguntas tipo test/i);
    const iS = lastIdx(/^Solucionario\b/i);
    const iE = lastIdx(/^(\d+\.\s*)?Esquema/i);
    let iB = lines.findIndex((l, i) => i > iS && /^(Bibliograf|Fuentes|Anexo)/i.test(l));
    if (iB < 0) iB = lines.length;
    if (iQ < 0 || iS < 0 || iS < iQ) return { entries: [], errores: [origen + ": no encuentro las secciones «Preguntas tipo test» y «Solucionario»."], avisos };

    // Ideas clave: esquema-resumen numerado y trampas frecuentes
    const resumen = [];
    if (iE >= 0 && iE < iQ) {
      let trampas = false;
      for (let i = iE + 1; i < iQ; i++) {
        const l = lines[i];
        if (/^trampas/i.test(l)) { trampas = true; continue; }
        if (/^\d{1,2}$/.test(l)) continue; // superíndices sueltos
        const m = l.match(/^\d{1,2}\.\s+(.+)/), b = l.match(/^[•·▪\-–]\s*(.+)/);
        if (m || b) resumen.push((trampas ? "Trampa frecuente: " : "") + (m ? m[1] : b[1]));
        else if (resumen.length) resumen[resumen.length - 1] += " " + l;
      }
    }

    // Preguntas
    const qs = []; let cur = null, opt = null;
    for (let i = iQ + 1; i < iS; i++) {
      const l = lines[i];
      const mq = l.match(/^(\d{1,2})[\.\)]\s+(.+)/);
      if (mq && parseInt(mq[1], 10) === qs.length + 1) { cur = { n: qs.length + 1, p: mq[2], o: [] }; qs.push(cur); opt = null; continue; }
      const mo = l.match(/^([a-fA-F])[\)\.]\s*(.*)/);
      if (cur && mo && mo[1].toLowerCase().charCodeAt(0) - 97 === cur.o.length) { cur.o.push(mo[2]); opt = cur.o.length - 1; continue; }
      if (!cur) continue;
      if (opt === null) cur.p += " " + l; else cur.o[opt] += " " + l;
    }
    // Solucionario
    const sol = {}; let last = null;
    for (let i = iS + 1; i < iB; i++) {
      const l = lines[i];
      if (/^n\.?\s*º|^resp|^justific/i.test(l)) continue;
      const ms = l.match(/^(\d{1,2})\s*[\.\)]?\s+([a-fA-F])[\)\.]?(?:\s+(.*))?$/);
      if (ms) { last = parseInt(ms[1], 10); sol[last] = { r: ms[2].toLowerCase(), e: (ms[3] || "").trim() }; }
      else if (last !== null) sol[last].e = (sol[last].e + " " + l).trim();
    }
    const preguntas = [];
    qs.forEach((q) => {
      const s = sol[q.n];
      if (!s) { errores.push(origen + ", pregunta " + q.n + ": no aparece en el solucionario."); return; }
      const idx = s.r.charCodeAt(0) - 97;
      const r = normQuestion({ p: q.p, o: q.o, correcta: s.r.toUpperCase(), e: s.e }, 1);
      if (r.error || idx >= q.o.length) { errores.push(origen + ", pregunta " + q.n + ": " + (r.error || "la letra del solucionario no corresponde a ninguna opción")); return; }
      preguntas.push(r.q);
    });
    if (!qs.length) errores.push(origen + ": no se han reconocido preguntas numeradas con opciones a), b), c), d).");
    if (!id) avisos.push(origen + ": elige a qué tema corresponde en el desplegable.");
    if (!resumen.length && preguntas.length) avisos.push(origen + ": no se ha encontrado el esquema-resumen; las ideas clave del tema no cambian.");
    return { entries: preguntas.length ? [{ id, titulo, resumen, preguntas, origen }] : [], errores, avisos };
  }

  // pdf.js se carga bajo demanda desde cdnjs; el script del worker se carga también como <script>
  // para que pdf.js trabaje en el hilo principal (el visor no permite workers de otro origen).
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfjsReady = null;
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar " + src)); document.head.appendChild(s); });
  }
  function loadPdfJs() {
    if (!pdfjsReady) pdfjsReady = loadScript(PDFJS + "pdf.worker.min.js").then(() => loadScript(PDFJS + "pdf.min.js")).then(() => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
      return window.pdfjsLib;
    }).catch((e) => { pdfjsReady = null; throw e; });
    return pdfjsReady;
  }
  async function pdfToLines(buffer) {
    const pdfjs = await loadPdfJs();
    const doc = await pdfjs.getDocument({ data: new Uint8Array(buffer), isEvalSupported: false }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items.filter((it) => typeof it.str === "string" && it.str.trim() !== "")
        .map((it) => ({ s: it.str, x: it.transform[4], y: it.transform[5], h: Math.abs(it.transform[3]) || it.height || 10, w: it.width || 0 }))
        .sort((a, b) => b.y - a.y || a.x - b.x);
      const lines = [];
      items.forEach((it) => {
        const ln = lines.find((l) => Math.abs(l.y - it.y) <= Math.max(2.5, Math.min(l.h, it.h) * 0.45));
        if (ln) { ln.items.push(it); ln.h = Math.max(ln.h, it.h); } else lines.push({ y: it.y, h: it.h, items: [it] });
      });
      lines.sort((a, b) => b.y - a.y);
      // Superíndices y subíndices: líneas formadas solo por fragmentos más pequeños que la línea vecina
      // se integran en la línea normal más cercana (arriba o abajo) si están a menos de ~0,7 veces su altura.
      const mainH = (l) => Math.max(...l.items.map((it) => it.h));
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i], h = mainH(l);
        const cands = [lines[i - 1], lines[i + 1]].filter(Boolean).filter((n) => mainH(n) * 0.85 > h && Math.abs(n.y - l.y) <= mainH(n) * 0.7);
        if (!cands.length) continue;
        const target = cands.sort((a, b) => Math.abs(a.y - l.y) - Math.abs(b.y - l.y))[0];
        target.items.push(...l.items.map((it) => ({ ...it, small: true })));
        lines.splice(i, 1); i--;
      }
      pages.push(lines.map((l) => {
        l.items.sort((a, b) => a.x - b.x);
        let out = "", end = null;
        l.items.forEach((it) => {
          if (end !== null && !it.small && it.x - end > l.h * 0.15 && !/\s$/.test(out) && !/^\s/.test(it.s)) out += " ";
          out += it.s; end = it.x + it.w;
        });
        return out;
      }));
    }
    // Cabeceras y pies repetidos en la mayoría de páginas se descartan (salvo para detectar el n.º de tema)
    const count = {};
    pages.forEach((ls) => new Set(ls).forEach((l) => (count[l] = (count[l] || 0) + 1)));
    const rep = (l) => pages.length >= 4 && count[l] >= Math.ceil(pages.length / 2) && l.length < 120;
    const header = Object.keys(count).filter(rep).join(" · ");
    const all = [];
    pages.forEach((ls) => ls.forEach((l) => { if (!rep(l)) all.push(l); }));
    if (header) all.unshift(header);
    return all;
  }

  // Fusiona con lo ya cargado: una pregunta con el mismo enunciado se actualiza; las nuevas se añaden.
  function mergeImport(byId) {
    const resumen = [];
    Object.keys(byId).forEach((id) => {
      const nuevo = byId[id];
      const prev = state.temas[id] || (T.misTemas || {})[id] || { titulo: "", resumen: [], preguntas: [] };
      const byHash = new Map(prev.preguntas.map((q, i) => [hash(q[0]), i]));
      const preguntas = prev.preguntas.slice();
      let add = 0, upd = 0;
      nuevo.preguntas.forEach((q) => {
        const h = hash(q[0]);
        if (byHash.has(h)) { preguntas[byHash.get(h)] = q; upd++; }
        else { byHash.set(h, preguntas.length); preguntas.push(q); add++; }
      });
      state.temas[id] = {
        titulo: nuevo.titulo || prev.titulo || "",
        resumen: nuevo.resumen.length ? nuevo.resumen : prev.resumen || [],
        preguntas, ts: Date.now()
      };
      resumen.push({ id, add, upd, total: preguntas.length });
    });
    applyImports(); save();
    return resumen;
  }

            <select id="q-tema">${T.temas.map((t) => `<option value="${t.id}">${t.label}. ${esc(t.titulo)}</option>`).join("")}</select></div>
          <div class="field"><label for="q-p">Enunciado</label><textarea id="q-p" required></textarea></div>
          <div class="field"><label for="q-ok" style="color:var(--ok)">Respuesta correcta</label><input type="text" id="q-ok" required></div>
          <div class="form-grid">
            ${[1, 2, 3].map((i) => `<div class="field"><label for="q-ko${i}">Incorrecta ${i}</label><input type="text" id="q-ko${i}" ${i === 1 ? "required" : ""}></div>`).join("")}
          </div>
          <div class="field"><label for="q-e">Explicación o artículo (opcional)</label><input type="text" id="q-e"></div>
          <div><button class="btn btn-primary" type="submit">Guardar pregunta</button></div>
        </form>
        ${mine.map((q) => `<div class="stack" style="gap:4px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px">
          <span class="eyebrow">${temaById[q.tema] ? temaById[q.tema].label : "?"}</span>
          <strong>${esc(q.p)}</strong>
          <span style="color:var(--ok)">${esc(q.o[0])}</span>
          <div><button class="btn btn-sm btn-danger" data-del="${esc(q.id)}">Eliminar</button></div>
        </div>`).join("")}
      </details>

      <section class="stack">
        <h2>Copia de seguridad</h2>
        <p class="muted">Tus temas cargados, tus preguntas y tu progreso se guardan solo en este navegador. Exporta una copia de vez en cuando para no perderlos o para pasarlos a otro dispositivo.</p>
        ${backupControls()}
      </section>
    `);
    bindBackup();

    const ta = document.getElementById("imp-temas");
    const box = document.getElementById("imp-preview");
    let pending = null;
    const opcionesTema = (sel) => `<option value="">— Elige el tema —</option>${T.bloques.map((b) => `<optgroup label="${esc(b.nombre)}">${T.temas.filter((t) => t.bloque === b.id).map((t) => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${t.label}. ${esc(ORIG[t.id].titulo).slice(0, 70)}</option>`).join("")}</optgroup>`).join("")}`;
    const renderPending = () => {
      const parsed = pending;
      const nq = parsed.entries.reduce((a, e) => a + e.preguntas.length, 0);
      box.innerHTML = `<div class="stack" style="gap:10px">
        ${parsed.entries.map((e, i) => { const q = e.preguntas[0]; return `<div class="panel-flat stack" style="gap:8px">
          <div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(e.origen)}</span><span class="chip accent num">${e.preguntas.length} preguntas · ${e.resumen.length} ideas clave</span></div>
          ${e.titulo ? `<strong>${esc(e.titulo)}</strong>` : ""}
          <div class="field"><label for="imp-sel-${i}">Cargar en el tema</label><select id="imp-sel-${i}" data-entry="${i}">${opcionesTema(e.id)}</select></div>
          <span class="muted" style="font-size:.9rem">Muestra: ${esc(q[0])}</span>
          <span style="color:var(--ok);font-size:.9rem">✓ ${esc(q[1][0])}</span>
          ${q[2] ? `<span class="muted" style="font-size:.85rem">Explicación: ${esc(q[2])}</span>` : ""}
        </div>`; }).join("")}
        ${parsed.avisos.map((a) => `<p class="explain">${esc(a)}</p>`).join("")}
        ${parsed.errores.length ? `<div class="panel-flat stack" style="gap:4px;border-color:var(--ko)"><strong style="color:var(--ko)">${parsed.errores.length} ${parsed.errores.length === 1 ? "problema" : "problemas"} (esas preguntas no se cargarán)</strong>
          ${parsed.errores.slice(0, 30).map((e) => `<span style="font-size:.9rem">· ${esc(e)}</span>`).join("")}${parsed.errores.length > 30 ? `<span class="muted">… y ${parsed.errores.length - 30} más</span>` : ""}</div>` : ""}
        ${nq ? `<div><button class="btn btn-primary" id="imp-load">Cargar ${nq} preguntas</button></div>` : ""}
      </div>`;
      box.querySelectorAll("[data-entry]").forEach((sel) => (sel.onchange = () => { pending.entries[sel.dataset.entry].id = sel.value || null; }));
      const btn = document.getElementById("imp-load");
      if (btn) btn.onclick = () => {
        if (pending.entries.some((e) => !e.id)) { toast("Elige el tema de destino de cada bloque"); return; }
        const byId = {};
        pending.entries.forEach((e) => {
          const t = byId[e.id] || (byId[e.id] = { titulo: "", resumen: [], preguntas: [] });
          if (e.titulo) t.titulo = e.titulo;
          if (e.resumen.length) t.resumen = e.resumen;
          t.preguntas = t.preguntas.concat(e.preguntas);
        });
        const r = mergeImport(byId);
        const add = r.reduce((a, x) => a + x.add, 0), upd = r.reduce((a, x) => a + x.upd, 0);
        toast(add + " preguntas nuevas" + (upd ? " y " + upd + " actualizadas" : "") + " en " + r.length + (r.length === 1 ? " tema" : " temas"));
        importPreview = null; renderImportar();
      };
    };
    const showPreview = () => { pending = parseImport(ta.value, "Texto pegado"); renderPending(); };
    document.getElementById("imp-check").onclick = showPreview;
    document.getElementById("imp-clear").onclick = () => { ta.value = ""; box.innerHTML = ""; pending = null; };
    document.getElementById("imp-temas-file").onchange = async (ev) => {
      const files = [...ev.target.files]; ev.target.value = ""; if (!files.length) return;
      box.innerHTML = `<p class="muted">Leyendo ${files.length} ${files.length === 1 ? "archivo" : "archivos"}…</p>`;
      const acc = { entries: [], errores: [], avisos: [] };
      for (const f of files) {
        try {
          let r;
          if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") r = parseTemaText(await pdfToLines(await f.arrayBuffer()), f.name);
          else r = parseImport(await f.text(), f.name);
          acc.entries.push(...r.entries); acc.errores.push(...r.errores); acc.avisos.push(...r.avisos);
        } catch (e) {
          acc.errores.push(f.name + ": no se ha podido leer (" + (e && e.message ? e.message : "error desconocido") + "). Para leer PDF hace falta conexión a internet.");
        }
      }
      pending = acc; renderPending();
    };
    document.getElementById("copy-prompt").onclick = () => {
      navigator.clipboard.writeText(PROMPT_FORMATO).then(() => toast("Instrucciones copiadas"), () => {
        const r = document.createRange(); r.selectNodeContents(document.getElementById("prompt-formato"));
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Texto seleccionado: cópialo");
      });
    };
    $main.querySelectorAll("[data-quitar]").forEach((b) => (b.onclick = () => { importPreview = { quitar: b.dataset.quitar }; renderImportar(); }));
    $main.querySelectorAll("[data-quitar-no]").forEach((b) => (b.onclick = () => { importPreview = null; renderImportar(); }));
    $main.querySelectorAll("[data-quitar-ok]").forEach((b) => (b.onclick = () => {
      delete state.temas[b.dataset.quitarOk]; applyImports(); save(); importPreview = null; toast("Tema restaurado a las preguntas de ejemplo"); renderImportar();
    }));

    document.getElementById("qform").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const v = (id) => document.getElementById(id).value.trim();
      const o = [v("q-ok"), v("q-ko1"), v("q-ko2"), v("q-ko3")].filter(Boolean);
      if (!v("q-p") || o.length < 2) { toast("Escribe el enunciado, la correcta y al menos una incorrecta"); return; }
      state.custom.push({ id: "u-" + Date.now().toString(36), tema: v("q-tema"), p: v("q-p"), o, e: v("q-e") });
      save(); toast("Pregunta guardada"); renderImportar();
    });
    $main.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => {
      state.custom = state.custom.filter((q) => q.id !== b.dataset.del);
      delete state.stats[b.dataset.del]; save(); renderImportar();
    }));
  }

  render();
})();

</script>
</body>
</html>
